    .ib-close{border:none;background:transparent;color:#b3b7c7;font-size:20px;cursor:pointer;line-height:1;padding:0 4px}
    @media(max-width:768px){.install-banner{bottom:10px}}

  <!-- 安装到主屏幕引导 -->
  <div class="install-banner" id="install-banner" hidden>
    <div class="ib-icon"><img src="assets/icon-192.png" alt=""></div>
    <div class="ib-text">
      <strong>安装到手机</strong>
      <span>添加到主屏幕，像 App 一样随时打开</span>
    </div>
    <button class="ib-btn" id="ib-install">安装</button>
    <button class="ib-close" onclick="document.getElementById('install-banner').hidden=true" aria-label="关闭">×</button>
  </div>

  <script>
    // ===== PWA：安装引导 + Service Worker =====
    let deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
      const isMobile = window.matchMedia('(pointer: coarse)').matches || /Mobi|Android/i.test(navigator.userAgent);
      if (isMobile && window.matchMedia('(display-mode: browser)').matches) {
        const b = document.getElementById('install-banner');
        if (b) setTimeout(function () { b.hidden = false; }, 1500);
      }
    });
    var ibBtn = document.getElementById('ib-install');
    if (ibBtn) ibBtn.addEventListener('click', function () {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      try { deferredInstallPrompt.userChoice; } catch (_) {}
      deferredInstallPrompt = null;
      var b = document.getElementById('install-banner');
      if (b) b.hidden = true;
    });
    window.addEventListener('appinstalled', function () {
      var b = document.getElementById('install-banner');
      if (b) b.hidden = true;
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function (reg) {
          reg.addEventListener('updatefound', function () {
            var installing = reg.installing;
            if (!installing) return;
            installing.addEventListener('statechange', function () {
              if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                if (window.showToast) window.showToast('已更新到最新版本，正在刷新…');
                setTimeout(function () { location.reload(); }, 1200);
              }
            });
          });
        }).catch(function () {});
      });
    }
  </script>
