name: 工作台云端同步（全量自动更新）

on:
  schedule:
    # 北京时间 08:00（UTC 00:00）每天跑一次；脚本内部按「今天星期几」决定跑哪些周模块
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      module:
        description: '只跑某一模块 key（调试用，留空则按星期跑全部该跑的）'
        required: false
        default: ''
      force_duplicate:
        description: '当天已更新过也强制再跑一次（会重复追加，调试用，填 1 表示强制）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 语料源自检（无需密钥）
        run: |
          echo "语料文件数: $(ls scripts/corpus/*.json 2>/dev/null | wc -l)"
          python - <<'PY'
          import glob, json, os
          files = sorted(glob.glob('scripts/corpus/*.json'))
          assert len(files) == 12, f'语料数量异常: {len(files)}（应为 12）'
          for f in files:
              d = json.load(open(f, encoding='utf-8'))
              n = len(d.get('items', []))
              assert n > 0, f'{f} 无可用轮次'
              print(f"  {os.path.basename(f):24s} {n} 轮")
          print('语料自检通过：离线语料源可用，不依赖任何外部 API Key / 本地 agent / 人工。')
          PY

      - name: 运行云端同步
        env:
          # 密钥可选：配了就用实时生成（带自检），没配/失效自动走离线语料
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          NEWS_LLM_API_KEY: ${{ secrets.NEWS_LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_EXTRA_JSON: ${{ secrets.LLM_EXTRA_JSON }}
          FORCE_MODULE: ${{ github.event.inputs.module }}
          FORCE_DUPLICATE: ${{ github.event.inputs.force_duplicate }}
        run: |
          python scripts/cloud_sync.py

      - name: 同步失败通知（仅记录）
        if: failure()
        run: echo "云端同步未完全成功，请查看上方日志"
